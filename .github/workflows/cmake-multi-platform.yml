# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: CMake on multiple platforms

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["master"]

env:
  VCPKG_COMMIT: d015e31e90838a4c9dfa3eed45979bc70d9357fc

jobs:
  build-linux:
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      matrix:
        include:
          - os: ubuntu-latest
            container: fedora:44
          - os: ubuntu-latest
            container: debian:13
          - os: ubuntu-latest
            container: rockylinux/rockylinux:10
          - os: ubuntu-latest
            container: archlinux:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Cache vcpkg archives (RockyLinux)
        if: matrix.container == 'rockylinux/rockylinux:10'
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-rocky-${{ env.VCPKG_COMMIT }}-${{ hashFiles('ci/strip-quazip-qt-deps.jq') }}
          restore-keys: |
            vcpkg-rocky-${{ env.VCPKG_COMMIT }}-

      - name: Prepare (Fedora 44)
        if: matrix.container == 'fedora:44'
        run: |
          dnf install -y cmake cmark gcc-c++ \
            qt6-qtbase-devel qt6-qtwebengine-devel \
            qt6-qtpdf-devel ps2pdf libreofficekit-devel \
            quazip-qt6-devel poppler-qt6-devel \
            cmark-devel djvulibre-devel \
            mupdf-devel tesseract-devel \
            mujs-devel gumbo-parser-devel openjpeg2-devel jbig2dec-devel \
            man ghostscript qt6-linguist \
            rpmbuild

      - name: Prepare (Debian 13)
        if: matrix.container == 'debian:13'
        run: |
          apt-get update
          apt-get install -y cmake cmark g++ \
            qt6-base-dev qt6-webengine-dev \
            qt6-pdf-dev libreofficekit-dev \
            libquazip1-qt6-dev libpoppler-qt6-dev \
            libcmark-dev libdjvulibre-dev \
            libharfbuzz-dev \
            libmupdf-dev libtesseract-dev \
            man groff ghostscript qt6-tools-dev qt6-l10n-tools \
            pkg-config
          export PATH=/usr/lib/qt6/bin:$PATH

      - name: Prepare (RockyLinux 10)
        if: matrix.container == 'rockylinux/rockylinux:10'
        run: |
          dnf install -y epel-release
          dnf config-manager --enable crb devel
          dnf install -y cmake gcc-c++ make ninja-build git jq \
            zip unzip tar perl python3 pkgconfig \
            autoconf automake libtool autoconf-archive \
            qt6-qtbase-devel qt6-qtwebengine-devel \
            qt6-qt5compat-devel \
            qt6-qtpdf-devel \
            cmark cmark-devel djvulibre-devel \
            tesseract-devel \
            man ghostscript
          git clone https://github.com/microsoft/vcpkg /opt/vcpkg
          git -C /opt/vcpkg checkout "$VCPKG_COMMIT"
          /opt/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          overlay="$GITHUB_WORKSPACE/vcpkg-overlay-ports"
          for p in quazip; do
            mkdir -p "$overlay/$p"
            cp -r /opt/vcpkg/ports/$p/. "$overlay/$p/"
            f="$overlay/$p/vcpkg.json"
            jq -f "$GITHUB_WORKSPACE/ci/strip-quazip-qt-deps.jq" "$f" > "$f.tmp"
            mv "$f.tmp" "$f"
          done
          ( cd /opt/vcpkg && ./vcpkg install --triplet=x64-linux-dynamic --overlay-ports="$overlay" libmupdf quazip )
          vlib=/opt/vcpkg/installed/x64-linux-dynamic
          {
            echo "PKG_CONFIG_PATH=$vlib/lib/pkgconfig:$PKG_CONFIG_PATH"
            echo "CMAKE_PREFIX_PATH=$vlib:$CMAKE_PREFIX_PATH"
            echo "LIBRARY_PATH=$vlib/lib:$LIBRARY_PATH"
            echo "LD_LIBRARY_PATH=$vlib/lib:$LD_LIBRARY_PATH"
            echo "CPLUS_INCLUDE_PATH=$vlib/include:$CPLUS_INCLUDE_PATH"
            echo "APVLV_WITH_OFFICE=OFF"
            echo "APVLV_WITH_POPPLER=OFF"
          } >> "$GITHUB_ENV"

      - name: Prepare (Arch Linux)
        if: matrix.container == 'archlinux:latest'
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel cmake make gcc \
            qt6-base qt6-webengine qt6-5compat \
            libreoffice-fresh-sdk jdk-openjdk \
            quazip-qt6 poppler-qt6 \
            pkg-config \
            cmark djvulibre \
            mupdf mujs tesseract \
            man-db groff ghostscript qt6-tools \
            gtk3

      - name: Build (Linux)
        run: |
          test -d /usr/lib/qt6/bin && export PATH=/usr/lib/qt6/bin:$PATH
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release \
            -DAPVLV_WITH_OFFICE=${APVLV_WITH_OFFICE:-ON} \
            -DAPVLV_WITH_POPPLER=${APVLV_WITH_POPPLER:-ON}
          cmake --build build --parallel $(nproc)

  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtwebengine qtpdf qt5compat qtpositioning qtwebchannel qtactiveqt
          cache: true

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache vcpkg archives
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: vcpkg-windows-${{ env.VCPKG_COMMIT }}-${{ hashFiles('scripts/build.ps1', 'ci/strip-quazip-qt-deps.jq', 'vcpkg-overlay-triplets/x64-windows.cmake') }}
          restore-keys: |
            vcpkg-windows-${{ env.VCPKG_COMMIT }}-

      - name: Build (Windows)
        shell: pwsh
        run: scripts/build.ps1 -VcpkgCommit $env:VCPKG_COMMIT

